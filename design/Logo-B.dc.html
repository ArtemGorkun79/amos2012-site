<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Golos+Text:wght@500;700;900&family=Manrope:wght@400;500;600&display=swap');
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Manrope', system-ui, sans-serif; }
  </style>
</helmet>
<div style="display:flex; flex-direction:column; gap:24px; width:560px; padding:24px; background:oklch(97% 0.004 90); font-family:'Manrope', sans-serif;">

  <div style="display:flex; flex-direction:column; gap:8px;">
    <div style="font-size:12px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:oklch(45% 0.01 240);">Option B — Hex Monogram</div>
    <div style="font-size:13px; color:oklch(45% 0.01 240); line-height:1.5;">A geometric "A" set inside a hexagon frame — stability and structure. Doubles cleanly as a favicon or app icon.</div>
  </div>

  <div style="display:flex; flex-direction:column; gap:2px; border-radius:4px; overflow:hidden; border:1px solid oklch(90% 0.005 90);">
    <div style="display:flex; align-items:center; justify-content:center; gap:20px; padding:56px 40px; background:{{graphite}};">
      <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M32 3L58 17.5V46.5L32 61L6 46.5V17.5L32 3Z" stroke="{{teal}}" stroke-width="2.5"/>
        <path d="M32 18L46 46H37.5L32 34L26.5 46H18L32 18Z" fill="{{teal}}"/>
        <rect x="29.5" y="18" width="5" height="5" fill="{{accent}}"/>
      </svg>
      <div style="display:flex; flex-direction:column; line-height:1;">
        <div style="font-family:'Golos Text', sans-serif; font-weight:900; font-size:30px; letter-spacing:0.01em; color:oklch(97% 0.004 90);">AMOS</div>
        <div style="font-family:'Golos Text', sans-serif; font-weight:600; font-size:13px; letter-spacing:0.26em; color:{{accent}}; margin-top:4px;">2012</div>
      </div>
    </div>
    <div style="display:flex; align-items:center; justify-content:center; gap:20px; padding:56px 40px; background:oklch(99% 0.002 90);">
      <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M32 3L58 17.5V46.5L32 61L6 46.5V17.5L32 3Z" stroke="{{graphite}}" stroke-width="2.5"/>
        <path d="M32 18L46 46H37.5L32 34L26.5 46H18L32 18Z" fill="{{teal}}"/>
        <rect x="29.5" y="18" width="5" height="5" fill="{{accent}}"/>
      </svg>
      <div style="display:flex; flex-direction:column; line-height:1;">
        <div style="font-family:'Golos Text', sans-serif; font-weight:900; font-size:30px; letter-spacing:0.01em; color:{{graphite}};">AMOS</div>
        <div style="font-family:'Golos Text', sans-serif; font-weight:600; font-size:13px; letter-spacing:0.26em; color:{{accent}}; margin-top:4px;">2012</div>
      </div>
    </div>
  </div>

  <div style="display:flex; align-items:center; gap:16px; padding:20px; background:oklch(99% 0.002 90); border:1px solid oklch(90% 0.005 90); border-radius:4px;">
    <svg width="30" height="30" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M32 3L58 17.5V46.5L32 61L6 46.5V17.5L32 3Z" stroke="{{graphite}}" stroke-width="3"/>
      <path d="M32 18L46 46H37.5L32 34L26.5 46H18L32 18Z" fill="{{teal}}"/>
      <rect x="29.5" y="18" width="5" height="5" fill="{{accent}}"/>
    </svg>
    <div style="font-size:12px; color:oklch(45% 0.01 240);">The hex monogram alone is the strongest favicon/app-icon candidate of the three.</div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"teal":{"editor":"color","default":"oklch(27% 0.045 195)"},"graphite":{"editor":"color","default":"oklch(24% 0.008 250)"},"accent":{"editor":"color","default":"oklch(72% 0.13 55)"}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      teal: this.props.teal ?? 'oklch(27% 0.045 195)',
      graphite: this.props.graphite ?? 'oklch(24% 0.008 250)',
      accent: this.props.accent ?? 'oklch(72% 0.13 55)'
    };
  }
}
</script>
</body>
</html>
